<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Website Detector</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #000000, #121212, #1c1c1c);
      color: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-size: 2.3rem;
      color: #ff1744;
      text-shadow: 0 0 12px rgba(255, 23, 68, 0.7);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 1rem;
    }

    form {
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 0 35px rgba(255, 23, 68, 0.15);
      text-align: center;
      transition: 0.3s ease;
    }

    form:hover {
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.25);
      transform: translateY(-2px);
    }

    input[type="text"] {
      width: 320px;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 15px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: 0.3s;
    }

    input[type="text"]::placeholder {
      color: #888;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 10px rgba(255, 23, 68, 0.6);
      background-color: rgba(255, 255, 255, 0.18);
    }

    button {
      background: linear-gradient(45deg, #b71c1c, #7f0000);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 25px;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 23, 68, 0.3);
    }

    button:hover {
      background: linear-gradient(45deg, #d50000, #9a0007);
      box-shadow: 0 0 15px rgba(255, 23, 68, 0.7);
      transform: scale(1.05);
    }

    .result {
      margin-top: 25px;
      padding: 16px;
      border-radius: 12px;
      font-size: 18px;
      width: 100%;
      animation: fadeIn 0.6s ease-in-out;
    }

    .safe {
      background: linear-gradient(45deg, #1b5e20, #2e7d32);
      color: #c8e6c9;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.6);
       align-items: center;
      justify-content: center;
    }

    .phishing {
      background: linear-gradient(45deg, #8b0000, #b71c1c);
      color: #ffebee;
      box-shadow: 0 0 12px rgba(244, 67, 54, 0.6);
       align-items: center;
      justify-content: center;
    }

    .unknown {
      background: linear-gradient(45deg, #2f2f2f, #424242);
      color: #eeeeee;
      box-shadow: 0 0 12px rgba(189, 189, 189, 0.4);
       align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>
  <h1> Phishing Website Detector</h1>
  <p>Enter a URL to find out if it’s a phishing site or safe.</p>

  <form method="POST">
    <input type="text" name="url" placeholder="Enter website URL" required>
    <br>
    <button type="submit">Analyze</button>

    {% if predict %}
      {% if "Phishing" in predict %}
        <div class="result phishing">{{ predict }}</div>
      {% elif "good" in predict or "healthy" in predict %}
        <div class="result safe">{{ predict }}</div>
      {% else %}
        <div class="result unknown">{{ predict }}</div>
      {% endif %}
    {% endif %}
  </form>

</body>
</html>
